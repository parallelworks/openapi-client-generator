openapi: "3.1.0"
info:
  title: Header Params Test
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion
      parameters:
        - name: X-Conversation-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Request-Priority
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chat/completions/stream:
    post:
      operationId: streamChatCompletion
      summary: Stream a chat completion
      parameters:
        - name: X-Conversation-Id
          in: header
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Streaming chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health:
    get:
      operationId: healthCheck
      summary: Health check with no optional params
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ChatResponse:
      type: object
      required:
        - reply
      properties:
        reply:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
